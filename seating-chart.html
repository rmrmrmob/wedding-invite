<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Seating Chart</title>
<style>
  @font-face { font-family: 'Alfa'; src: url('fonts/AlfaSlabOne-Regular.ttf'); }
  @font-face { font-family: 'Yellowtail'; src: url('fonts/Yellowtail-Regular.ttf'); }
  @font-face { font-family: 'Rounded'; font-weight: 700;
    src: url('fonts/MPLUSRounded1c-Bold.ttf'); }
  @font-face { font-family: 'Rounded'; font-weight: 900;
    src: url('fonts/MPLUSRounded1c-Black.ttf'); }

  :root {
    --cherry: #D7263D;
    --cherry-deep: #A31621;
    --cream: #FFF6E9;
    --mustard: #FFB627;
    --teal: #17BEBB;
    --ink: #2B1B12;
    --paper: #FFFDF7;
  }
  * { box-sizing: border-box; margin: 0; }
  @page { size: 297mm 420mm; margin: 0; }
  html, body { width: 297mm; height: 420mm; }
  body { background: var(--cream); font-family: 'Rounded', sans-serif; color: var(--ink); overflow: hidden; position: relative; }

  .checker-top, .checker-bottom {
    position: absolute; left: 0; right: 0; height: 7mm;
    background: repeating-conic-gradient(#1A1A1A 0% 25%, #FFFFFF 0% 50%) 0 0 / 7mm 7mm;
  }
  .checker-top { top: 0; }
  .checker-bottom { bottom: 0; }

  .head { text-align: center; padding-top: 12mm; }
  .head .script { font-family: 'Yellowtail'; font-size: 21pt; color: var(--cherry); line-height: 1.25; }
  .head h1 {
    font-family: 'Alfa'; font-size: 38pt; color: var(--cherry);
    text-shadow: 2.2mm 2.2mm 0 var(--mustard); letter-spacing: 0.04em; margin-top: 4mm;
  }
  .head .sub {
    display: inline-block; margin-top: 2.6mm; font-weight: 900; font-size: 12pt;
    background: var(--ink); color: var(--cream); border-radius: 999px; padding: 1.6mm 8mm; letter-spacing: 0.16em;
  }

  /* ---- head table zone ---- */
  .hina-zone { display: flex; align-items: center; justify-content: center; gap: 6mm; margin-top: 7mm; }
  .hina {
    width: 120mm; height: 17mm; background: var(--cherry);
    border: 1.2mm solid var(--ink); border-radius: 999px;
    display: flex; align-items: center; justify-content: center; gap: 4mm;
    box-shadow: 0 2mm 0 var(--ink); color: #FFF;
  }
  .hina .names { font-family: 'Alfa'; font-size: 15pt; letter-spacing: 0.05em; }
  .hina .star { color: var(--mustard); font-size: 13pt; }
  .side-item { text-align: center; font-weight: 900; font-size: 8.5pt; color: #8A6F5A; }
  .side-item .circ {
    width: 15mm; height: 15mm; border-radius: 50%; background: var(--paper);
    border: 1mm solid var(--ink); margin: 0 auto 1mm;
    display: flex; align-items: center; justify-content: center; font-size: 13pt;
  }

  /* ---- side labels ---- */
  .sides { display: flex; justify-content: space-between; padding: 0 16mm; margin-top: 5mm; }
  .side-tag {
    font-weight: 900; font-size: 11.5pt; letter-spacing: 0.1em;
    padding: 1.4mm 6mm; border-radius: 999px; border: 0.8mm solid var(--ink);
    background: var(--paper); box-shadow: 0 1.4mm 0 var(--ink);
  }
  .side-tag.groom { color: #0E8683; }
  .side-tag.bride { color: var(--cherry-deep); }

  /* ---- table grid ---- */
  .grid {
    display: grid; grid-template-columns: repeat(6, 1fr); row-gap: 8mm;
    padding: 0 16mm; margin-top: 6mm; justify-items: center;
  }
  .table {
    width: 34mm; height: 34mm; border-radius: 50%;
    background: var(--paper);
    border: 1.1mm solid var(--ink);
    box-shadow: 0 1.8mm 0 rgba(43,27,18,.8), inset 0 0 0 1.6mm var(--cream);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    position: relative;
  }
  .table .no { font-family: 'Alfa'; font-size: 17pt; color: var(--cherry); line-height: 1; }
  .table .tlabel { font-family: 'Alfa'; font-size: 6pt; color: #B49A80; letter-spacing: 0.18em; margin-top: 1.2mm; }

  /* ---- entrances (right edge) ---- */
  .door {
    position: absolute; right: 4mm; width: 9mm; text-align: center;
    font-weight: 900; font-size: 6.5pt; color: #8A6F5A; line-height: 1.3;
  }
  .door .bar { width: 1.6mm; height: 16mm; background: var(--teal); border-radius: 1mm; margin: 0 auto 1mm; }

  /* ---- stage ---- */
  .stage {
    position: absolute; left: 16mm; right: 16mm; bottom: 13mm; height: 16mm;
    background: var(--ink); border-radius: 3mm;
    display: flex; align-items: center; justify-content: center; gap: 5mm;
    color: var(--cream);
  }
  .stage .en { font-family: 'Alfa'; font-size: 13pt; letter-spacing: 0.3em; color: var(--mustard); }
  .stage .jp { font-weight: 900; font-size: 11pt; letter-spacing: 0.4em; }
  .mc {
    position: absolute; left: 16mm; top: 62mm;
    font-family: 'Alfa'; font-size: 8pt; color: #FFF; background: var(--teal);
    border: 0.7mm solid var(--ink); border-radius: 2mm; padding: 1mm 3.4mm;
    box-shadow: 0 1.2mm 0 var(--ink); transform: rotate(-4deg);
  }
</style>
</head>
<body>
  <div class="checker-top"></div>

  <div class="head">
    <div class="script">Welcome to our Diner!</div>
    <h1>SEATING CHART</h1>
    <span class="sub">RICHARD &amp; HAZUKI &#9825; 2026.12.13 SUN</span>
  </div>

  <div class="mc">MC</div>

  <div class="hina-zone">
    <div class="side-item"><div class="circ">&#128367;&#65039;</div>メインキャンドル</div>
    <div class="hina">
      <span class="star">&#9733;</span>
      <span class="names">RICHARD &amp; HAZUKI</span>
      <span class="star">&#9733;</span>
    </div>
    <div class="side-item"><div class="circ">&#127874;</div>ウェディングケーキ</div>
  </div>

  <div class="sides">
    <span class="side-tag groom">&#8592; 新郎側 GROOM</span>
    <span class="side-tag bride">新婦側 BRIDE &#8594;</span>
  </div>

  <div class="grid" id="grid"></div>

  <div class="door" style="top: 148mm;"><div class="bar"></div>出入口A</div>
  <div class="door" style="top: 212mm;"><div class="bar"></div>出入口B</div>
  <div class="door" style="top: 330mm;"><div class="bar"></div>入退場<br>出入口</div>

  <div class="stage">
    <span class="en">STAGE</span>
    <span class="jp">舞台</span>
    <span class="en">STAGE</span>
  </div>

  <div class="checker-bottom"></div>

  <script>
    const g = document.getElementById('grid');
    for (let i = 1; i <= 42; i++) {
      const d = document.createElement('div');
      d.className = 'table';
      d.innerHTML = `<div class="no">${i}</div><div class="tlabel">TABLE</div>`;
      g.appendChild(d);
    }
  </script>
</body>
</html>
