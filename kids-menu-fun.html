<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>Kids Menu Fun</title><style>
@font-face{font-family:Titan;src:url('fonts/TitanOne-Regular.ttf')}
@font-face{font-family:Lucky;src:url('fonts/LuckiestGuy-Regular.ttf')}
@font-face{font-family:Script;src:url('fonts/Yellowtail-Regular.ttf')}
@font-face{font-family:R;font-weight:900;src:url('fonts/MPLUSRounded1c-Black.ttf')}
@font-face{font-family:R;font-weight:700;src:url('fonts/MPLUSRounded1c-Bold.ttf')}
:root{--ink:#2b2340;--red:#ff4d5e;--org:#ff9a2e;--yel:#ffd23f;--grn:#3ccf8e;--blu:#3fa9f5;--pur:#9b6bff;--pink:#ff7eb6;--bg:#fff7e0}
@page{size:210mm 297mm;margin:0}
*{box-sizing:border-box;margin:0}
html,body{width:210mm;height:297mm}
body{position:relative;overflow:hidden;font-family:R,sans-serif;color:var(--ink);
 background:radial-gradient(circle,#ffe39a 1.1mm,transparent 1.2mm) 0 0/11mm 11mm,radial-gradient(circle,#ffd0e2 0.8mm,transparent 0.9mm) 5.5mm 5.5mm/11mm 11mm,var(--bg)}
.abs{position:absolute}
.rainbow{left:50%;top:-34mm;transform:translateX(-50%);width:150mm;height:150mm;border-radius:50%;
 background:radial-gradient(circle,transparent 49%,var(--pur) 49% 54%,var(--blu) 54% 59%,var(--grn) 59% 64%,var(--yel) 64% 69%,var(--org) 69% 74%,var(--red) 74% 79%,transparent 79%);
 clip-path:inset(0 0 52% 0);opacity:.9}
.cloud{width:34mm;height:13mm;background:#fff;border-radius:999px;border:0.7mm solid var(--ink);box-shadow:0 1mm 0 var(--ink)}
.cloud::before,.cloud::after{content:'';position:absolute;background:#fff;border:0.7mm solid var(--ink);border-bottom:none;border-radius:50% 50% 0 0}
.cloud::before{width:13mm;height:7mm;left:5mm;top:-6.3mm}.cloud::after{width:16mm;height:9mm;left:14mm;top:-8.3mm}
.head{left:0;right:0;top:30mm;text-align:center}
.title{font-family:Lucky;font-size:64pt;line-height:1;letter-spacing:0.02em}
.title span{display:inline-block;-webkit-text-stroke:0.9mm var(--ink);paint-order:stroke fill;text-shadow:0 1.6mm 0 var(--ink)}
.ribbon{display:inline-block;margin-top:3mm;background:var(--pink);color:#fff;font-weight:900;font-size:18pt;letter-spacing:0.18em;padding:1.6mm 8mm 1.8mm 9mm;border:0.8mm solid var(--ink);border-radius:999px;box-shadow:0 1.3mm 0 var(--ink);transform:rotate(-2deg)}
.hi{margin-top:3.2mm;font-weight:900;font-size:10.5pt;color:var(--ink)}
.hi b{color:var(--red)}
.grid{left:13mm;right:13mm;top:93mm;display:grid;grid-template-columns:repeat(3,1fr);gap:7mm 5mm}
.card{position:relative;height:43mm;border:0.8mm solid var(--ink);border-radius:8mm;box-shadow:0 1.5mm 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff}
.card .no{position:absolute;top:-4mm;left:-2.5mm;width:10mm;height:10mm;border-radius:50%;border:0.7mm solid var(--ink);display:flex;align-items:center;justify-content:center;font-family:Lucky;font-size:13pt;color:#fff;-webkit-text-stroke:0.25mm var(--ink);paint-order:stroke fill}
.card .nm{font-weight:900;font-size:20pt;line-height:1.1;letter-spacing:0.04em;white-space:nowrap}
.card ruby rt{font-size:7pt;font-weight:700;letter-spacing:0.1em}
.card .en{font-family:Lucky;font-size:9pt;letter-spacing:0.08em;margin-top:2mm;opacity:.85}
.card .doodle{position:absolute;right:3mm;bottom:2.6mm;width:7mm;height:7mm}
.al{left:20mm;right:20mm;bottom:15mm;background:#fff;border:0.8mm solid var(--ink);border-radius:6mm;box-shadow:0 1.5mm 0 var(--ink);padding:2.6mm 4mm 3mm;text-align:center}
.al .h{font-weight:900;font-size:11pt}
.al .v{display:flex;justify-content:center;gap:2.5mm;margin-top:1.6mm}
.al .v span{font-weight:900;font-size:17pt;color:#fff;border:0.7mm solid var(--ink);border-radius:999px;padding:0.4mm 5mm;box-shadow:0 1mm 0 var(--ink)}
.al .n{font-weight:700;font-size:7.6pt;color:#6a5f7a;margin-top:1.8mm}
.foot{left:0;right:0;bottom:6mm;text-align:center;font-family:Lucky;font-size:8pt;letter-spacing:0.25em;color:#a194b8}
svg.d{position:absolute}
</style></head><body>
<div class="abs rainbow"></div>
<svg class="d" style="left:9mm;top:12mm;width:40mm;height:20mm" viewBox="0 0 120 60"><path d="M22 52 C8 52 4 40 12 33 C8 22 22 14 32 20 C36 6 58 4 64 18 C72 8 92 12 92 26 C106 24 114 38 104 46 C102 51 98 52 94 52 Z" fill="#fff" stroke="#2b2340" stroke-width="3.2" stroke-linejoin="round"/></svg>
<svg class="d" style="right:9mm;top:22mm;width:32mm;height:16mm" viewBox="0 0 120 60"><path d="M22 52 C8 52 4 40 12 33 C8 22 22 14 32 20 C36 6 58 4 64 18 C72 8 92 12 92 26 C106 24 114 38 104 46 C102 51 98 52 94 52 Z" fill="#fff" stroke="#2b2340" stroke-width="3.2" stroke-linejoin="round"/></svg>
<!-- doodles -->
<svg class="d" style="left:16mm;top:62mm;width:12mm;height:12mm" viewBox="0 0 40 40"><path d="M20 3 L24.5 15 L37 15.5 L27 23.5 L30.5 36 L20 28.8 L9.5 36 L13 23.5 L3 15.5 L15.5 15Z" fill="#ffd23f" stroke="#2b2340" stroke-width="2.6" stroke-linejoin="round"/></svg>
<svg class="d" style="right:17mm;top:66mm;width:11mm;height:11mm" viewBox="0 0 40 40"><path d="M20 35 C6 26 2 18 6 11 C10 5 17 7 20 13 C23 7 30 5 34 11 C38 18 34 26 20 35Z" fill="#ff7eb6" stroke="#2b2340" stroke-width="2.6" stroke-linejoin="round"/></svg>
<svg class="d" style="left:30mm;top:78mm;width:8mm;height:8mm" viewBox="0 0 40 40"><path d="M20 2 L23 17 L38 20 L23 23 L20 38 L17 23 L2 20 L17 17Z" fill="#3fa9f5" stroke="#2b2340" stroke-width="2.4" stroke-linejoin="round"/></svg>
<svg class="d" style="right:31mm;top:82mm;width:14mm;height:8mm" viewBox="0 0 60 30"><path d="M3 20 Q10 4 18 18 T33 18 T48 18 T58 12" fill="none" stroke="#3ccf8e" stroke-width="4" stroke-linecap="round"/></svg>
<div class="abs head">
  <div class="title"><span style="color:var(--red)">K</span><span style="color:var(--org);transform:translateY(-1.5mm) rotate(4deg)">I</span><span style="color:var(--yel)">D</span><span style="color:var(--grn);transform:translateY(-1mm) rotate(-5deg)">S</span>&nbsp;<span style="color:var(--blu)">M</span><span style="color:var(--pur);transform:translateY(-1.5mm) rotate(5deg)">E</span><span style="color:var(--pink)">N</span><span style="color:var(--red);transform:translateY(-1mm) rotate(-4deg)">U</span></div>
  <div class="ribbon">★ キッズメニュー ★</div>
  <div class="hi">きょうは きてくれて <b>ありがとう！</b> いっぱい たべてね</div>
</div>
<div class="abs grid">
  <div class="card" style="background:#ffe9ec;transform:rotate(-1.5deg)"><span class="no" style="background:var(--red)">1</span><div class="nm">オムライス</div><div class="en" style="color:var(--red)">OMELET RICE</div><svg class="doodle" viewBox="0 0 40 40"><path d="M20 3 L24.5 15 L37 15.5 L27 23.5 L30.5 36 L20 28.8 L9.5 36 L13 23.5 L3 15.5 L15.5 15Z" fill="#ffd23f" stroke="#2b2340" stroke-width="2.6"/></svg></div>
  <div class="card" style="background:#fff1df;transform:rotate(1deg)"><span class="no" style="background:var(--org)">2</span><div class="nm">ハンバーグ</div><div class="en" style="color:#e07800">HAMBURG</div></div>
  <div class="card" style="background:#fffadb;transform:rotate(-1deg)"><span class="no" style="background:var(--yel)">3</span><div class="nm">エビフライ</div><div class="en" style="color:#c99a00">FRIED SHRIMP</div><svg class="doodle" viewBox="0 0 40 40"><path d="M20 35 C6 26 2 18 6 11 C10 5 17 7 20 13 C23 7 30 5 34 11 C38 18 34 26 20 35Z" fill="#ff7eb6" stroke="#2b2340" stroke-width="2.6"/></svg></div>
  <div class="card" style="background:#e3f9ee;transform:rotate(1.5deg)"><span class="no" style="background:var(--grn)">4</span><div class="nm">からあげ</div><div class="en" style="color:#1fa86a">FRIED CHICKEN</div></div>
  <div class="card" style="background:#e3f2fe;transform:rotate(-1deg)"><span class="no" style="background:var(--blu)">5</span><div class="nm"><ruby>春<rt>はる</rt></ruby><ruby>巻<rt>ま</rt></ruby>き</div><div class="en" style="color:#1c86d1">SPRING ROLL</div><svg class="doodle" viewBox="0 0 40 40"><path d="M20 2 L23 17 L38 20 L23 23 L20 38 L17 23 L2 20 L17 17Z" fill="#9b6bff" stroke="#2b2340" stroke-width="2.4"/></svg></div>
  <div class="card" style="background:#efe7ff;transform:rotate(1deg)"><span class="no" style="background:var(--pur)">6</span><div class="nm"><ruby>焼売<rt>しゅうまい</rt></ruby></div><div class="en" style="color:#7a48e6">SHUMAI</div></div>
  <div class="card" style="background:#ffe8f3;transform:rotate(-1.5deg)"><span class="no" style="background:var(--pink)">7</span><div class="nm">ポテサラ</div><div class="en" style="color:#e04f92">POTATO SALAD</div></div>
  <div class="card" style="background:#ffe9ec;transform:rotate(1deg)"><span class="no" style="background:var(--red)">8</span><div class="nm">スープ</div><div class="en" style="color:var(--red)">SOUP</div><svg class="doodle" viewBox="0 0 40 40"><path d="M20 3 L24.5 15 L37 15.5 L27 23.5 L30.5 36 L20 28.8 L9.5 36 L13 23.5 L3 15.5 L15.5 15Z" fill="#3ccf8e" stroke="#2b2340" stroke-width="2.6"/></svg></div>
  <div class="card" style="background:#fff1df;transform:rotate(-1deg)"><span class="no" style="background:var(--org)">9</span><div class="nm">デザート</div><div class="en" style="color:#e07800">DESSERT</div></div>
</div>
<div class="abs al"><div class="h">アレルギー<ruby>特定原材料<rt>とくていげんざいりょう</rt></ruby></div>
  <div class="v"><span style="background:var(--red)">えび</span><span style="background:var(--org)">卵</span><span style="background:var(--grn)">小麦</span><span style="background:var(--blu)">乳</span></div>
  <div class="n">気になることがあれば、スタッフにお声がけください</div></div>
<div class="abs foot">RICHARD &amp; HAZUKI ・ 2026.12.13</div>
</body></html>
