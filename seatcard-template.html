<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>席札サンプル</title>
<style>
  @font-face { font-family: 'Alfa'; src: url('file:///home/user/wedding-invite/fonts/AlfaSlabOne-Regular.ttf'); }
  @font-face { font-family: 'Yellowtail'; src: url('file:///home/user/wedding-invite/fonts/Yellowtail-Regular.ttf'); }
  @font-face { font-family: 'Rounded'; font-weight: 700;
    src: url('file:///tmp/claude-0/-home-user-jp-stock-ai-trader/e76b6960-ed5f-5d99-b358-ca6527f5c049/scratchpad/gfonts/ofl/mplusrounded1c/MPLUSRounded1c-Bold.ttf'); }

  * { box-sizing: border-box; margin: 0; }
  body { background: #888; display: flex; flex-direction: column; gap: 20px; padding: 20px; align-items: center; }

  .card {
    width: 91mm; height: 55mm; background: #FFF9EE; border-radius: 2.5mm;
    display: flex; overflow: hidden; position: relative;
    box-shadow: 0 2mm 5mm rgba(0,0,0,.3);
  }
  .art {
    width: 55mm; height: 55mm; flex: none; position: relative;
    display: flex; align-items: center; justify-content: center;
  }
  .art svg { width: 44mm; height: 44mm; }
  .label {
    position: absolute; bottom: 2.6mm; left: 50%; transform: translateX(-50%) rotate(-2deg);
    font-family: 'Alfa'; font-size: 7pt; color: #FFF9EE; background: #2B1B12;
    padding: 0.8mm 3mm; border-radius: 999px; letter-spacing: 0.08em; white-space: nowrap;
  }
  .right {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 4mm 4mm 3mm; position: relative; text-align: center;
  }
  .right .welcome { font-family: 'Yellowtail'; font-size: 11pt; color: #D7263D; }
  .right .name { font-family: 'Rounded'; font-weight: 700; font-size: 15pt; color: #2B1B12; margin-top: 1.5mm; }
  .right .name small { display: block; font-size: 7.5pt; color: #8A6F5A; font-weight: 700; margin-top: 0.6mm; letter-spacing: 0.1em; }
  .right .foot {
    position: absolute; bottom: 2.6mm; left: 0; right: 0;
    font-family: 'Alfa'; font-size: 5.6pt; color: #B49A80; letter-spacing: 0.14em;
  }
  .checker {
    position: absolute; top: 0; bottom: 0; width: 1.6mm;
    background: repeating-linear-gradient(to bottom, #2B1B12 0 1.6mm, #FFF9EE 1.6mm 3.2mm);
  }
</style>
</head>
<body>

<!-- SAMPLE 1: HAMBURGER (bg: mustard diner wall) -->
<div class="card">
  <div class="art" style="background:
      radial-gradient(circle at 30% 25%, rgba(255,255,255,.35), transparent 40%),
      repeating-linear-gradient(0deg, rgba(180,120,30,.12) 0 2mm, transparent 2mm 7mm),
      linear-gradient(160deg, #F2C14E, #E0A52E);">
    <svg viewBox="0 0 100 100">
      <ellipse cx="50" cy="88" rx="34" ry="5" fill="rgba(90,50,20,.25)"/>
      <path d="M18 42 Q18 20 50 20 Q82 20 82 42 L18 42 Z" fill="#C98A3B" stroke="#8A5A20" stroke-width="1.4"/>
      <circle cx="35" cy="30" r="1.3" fill="#FFF3DC"/><circle cx="48" cy="26" r="1.3" fill="#FFF3DC"/>
      <circle cx="61" cy="30" r="1.3" fill="#FFF3DC"/><circle cx="43" cy="34" r="1.3" fill="#FFF3DC"/><circle cx="56" cy="35" r="1.3" fill="#FFF3DC"/>
      <path d="M16 46 Q25 40 32 46 Q39 52 46 46 Q53 40 60 46 Q67 52 74 46 Q80 41 84 46 L84 50 L16 50 Z" fill="#7FA653" stroke="#577536" stroke-width="1.2"/>
      <rect x="17" y="49" width="66" height="7" rx="3" fill="#E8B64C" stroke="#B2832A" stroke-width="1.2"/>
      <rect x="15" y="56" width="70" height="9" rx="4" fill="#7A4426" stroke="#53290F" stroke-width="1.4"/>
      <rect x="18" y="65" width="64" height="6" rx="3" fill="#C2403A" stroke="#8E241F" stroke-width="1.2"/>
      <path d="M16 71 Q16 84 50 84 Q84 84 84 71 L16 71 Z" fill="#C98A3B" stroke="#8A5A20" stroke-width="1.4"/>
    </svg>
    <span class="label">HAMBURGER</span>
  </div>
  <div class="checker" style="left: 55mm;"></div>
  <div class="right">
    <div class="welcome">Welcome!</div>
    <div class="name">砂川 太郎 様<small>SUNAKAWA TARO</small></div>
    <div class="foot">RICHARD &amp; HAZUKI ● 2026.12.13</div>
  </div>
</div>

<!-- SAMPLE 2: COLA (bg: teal soda fountain) -->
<div class="card">
  <div class="art" style="background:
      radial-gradient(circle at 70% 20%, rgba(255,255,255,.4), transparent 45%),
      repeating-linear-gradient(45deg, rgba(255,255,255,.12) 0 3mm, transparent 3mm 6mm),
      linear-gradient(160deg, #35B5AE, #17827C);">
    <svg viewBox="0 0 100 100">
      <ellipse cx="50" cy="90" rx="22" ry="4" fill="rgba(0,60,55,.3)"/>
      <path d="M40 12 L60 12 L58 22 Q64 30 62 44 Q60 54 62 62 Q64 78 58 88 L42 88 Q36 78 38 62 Q40 54 38 44 Q36 30 42 22 Z"
            fill="#7A2E1D" stroke="#4A1509" stroke-width="1.5"/>
      <path d="M43 25 Q40 32 41 44 Q42 52 41 60" stroke="rgba(255,255,255,.5)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <rect x="38" y="44" width="24" height="18" rx="2" fill="#C2403A" stroke="#8E241F" stroke-width="1.3"/>
      <text x="50" y="56" text-anchor="middle" font-family="Yellowtail" font-size="11" fill="#FFF3DC">Cola</text>
      <rect x="41" y="8" width="18" height="5" rx="1.5" fill="#B9BdBe" stroke="#7E8486" stroke-width="1.2"/>
      <line x1="57" y1="10" x2="72" y2="-2" stroke="#D9574F" stroke-width="4" stroke-linecap="round"/>
    </svg>
    <span class="label">COLA</span>
  </div>
  <div class="checker" style="left: 55mm;"></div>
  <div class="right">
    <div class="welcome">Welcome!</div>
    <div class="name">砂川 花子 様<small>SUNAKAWA HANAKO</small></div>
    <div class="foot">RICHARD &amp; HAZUKI ● 2026.12.13</div>
  </div>
</div>

<!-- SAMPLE 3: RECORD (bg: pink polka wall) -->
<div class="card">
  <div class="art" style="background:
      radial-gradient(circle at 8px 8px, rgba(255,255,255,.5) 1.4px, transparent 2px) 0 0 / 18px 18px,
      linear-gradient(160deg, #E8829E, #D25B7C);">
    <svg viewBox="0 0 100 100">
      <ellipse cx="50" cy="90" rx="28" ry="4" fill="rgba(120,20,50,.25)"/>
      <circle cx="50" cy="50" r="36" fill="#241F1E" stroke="#0E0B0A" stroke-width="1.5"/>
      <circle cx="50" cy="50" r="30" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="1"/>
      <circle cx="50" cy="50" r="25" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="1"/>
      <circle cx="50" cy="50" r="20" fill="none" stroke="rgba(255,255,255,.10)" stroke-width="1"/>
      <circle cx="50" cy="50" r="13" fill="#C2403A" stroke="#8E241F" stroke-width="1.2"/>
      <circle cx="50" cy="50" r="2.5" fill="#FFF3DC"/>
      <path d="M30 24 Q38 18 46 22" stroke="rgba(255,255,255,.55)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <text x="50" y="47.5" text-anchor="middle" font-family="Yellowtail" font-size="6.5" fill="#FFF3DC">Rock'n</text>
      <text x="50" y="56" text-anchor="middle" font-family="Yellowtail" font-size="6.5" fill="#FFF3DC">Roll</text>
    </svg>
    <span class="label">RECORD</span>
  </div>
  <div class="checker" style="left: 55mm;"></div>
  <div class="right">
    <div class="welcome">Welcome!</div>
    <div class="name">比嘉 一郎 様<small>HIGA ICHIRO</small></div>
    <div class="foot">RICHARD &amp; HAZUKI ● 2026.12.13</div>
  </div>
</div>

</body>
</html>
